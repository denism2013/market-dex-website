<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market-DEX loading animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  /* The stage is a brand splash screen, so it stays dark in both themes. */
  :root {
    --bg: #04050b;
    --ink: #c3c9da;
    --ink-dim: #7d859b;
    --line: #262b3d;
    --teal: #3fe0bd;
    --violet: #9a6cf5;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #04050b; } }
  :root[data-theme="dark"] { --bg: #04050b; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Montserrat", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #stage { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); max-width: 100%; }
  .controls { height: 56px; display: flex; gap: 10px; align-items: center; }
  .controls button {
    font: 500 13px/1 inherit; font-family: inherit; letter-spacing: .02em;
    color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 16px; cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .controls button:hover { border-color: var(--teal); color: #fff; }
  .controls button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .controls button[aria-pressed="true"] { background: #131728; border-color: var(--violet); color: #fff; }

.controls {display:none!important} body {overflow:hidden} #stage {width:min(100vw,100vh);height:min(100vw,100vh)}
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="Market-DEX logo: a bear slashes the chart down with three red claw marks, then a bull charges up and sends it climbing again."></canvas>
<div class="controls">
  <button id="btnPlay" type="button">Pause</button>
  <button id="btnSlow" type="button" aria-pressed="false">Slow motion</button>
  <button id="btnRestart" type="button">Restart</button>
</div>

    g.beginPath(); for (let x = -80; x <= 1080; x += 20) g.lineTo(x, f(x));
    g.shadowColor = col; g.shadowBlur = 46 * K; g.strokeStyle = rgb(hex(col), .16);
    g.lineWidth = lw; g.stroke(); g.lineWidth = lw * .35; g.stroke();
  });
  g.shadowBlur = 0;
  for (const s of STREAKS) {                                                 // floor reflections
    const u = s.x / 1000, base = mix(mix([50, 235, 195], [225, 232, 255], clamp(u * 2)), [160, 105, 255], clamp(u * 2 - 1));
    const c = mix(mix(base, [255, 50, 75], red * .8), [80, 255, 190], green * .8), a = s.a * (.45 + .25 * Math.sin(TAU * (s.sp * t / TT + s.ph))) * (.55 + red + green);
    const gr = g.createLinearGradient(0, 800, 0, 800 + s.len); gr.addColorStop(0, rgb(c, a * .55)); gr.addColorStop(1, rgb(c, 0)); g.fillStyle = gr; g.fillRect(s.x, 800, s.w, s.len);
  }
  const hz = g.createLinearGradient(0, 780, 0, 815); hz.addColorStop(0, 'rgba(120,140,255,0)'); hz.addColorStop(.6, 'rgba(120,140,255,.1)'); hz.addColorStop(1, 'rgba(120,140,255,0)'); g.fillStyle = hz; g.fillRect(0, 780, 1000, 35);
  g.restore();
}

const MOTES = (() => { const r = rng(77), a = []; for (let i = 0; i < 42; i++) a.push({ x: 85 + r() * 830, y: 330 + r() * 400, ph: r(), k: 1 + Math.floor(r() * 2), s: 2 + r() * 3.2, sway: 6 + r() * 14 }); return a; })();
function drawMotes() {                                                     // voxel motes drifting up through the badge
  const g = ctx; g.save(); g.globalCompositeOperation = 'lighter';
  for (const m of MOTES) { const u = (m.k * NOW / TT * 2 + m.ph) % 1, c = mix([63, 224, 189], [154, 108, 245], clamp((m.x - 300) / 400));
    g.fillStyle = rgb(c, .5 * Math.sin(Math.PI * u) * (.6 + .4 * Math.sin(TAU * (4 * NOW / TT + m.ph * 9)))); const sz = m.s * (1 - u * .4);
    g.fillRect(m.x + m.sway * Math.sin(TAU * (u + m.ph)), m.y - 130 * u, sz, sz); }
  g.restore();
}
function drawGround(P, home, col) {                                        // contact shadow + colour pool under each animal
  const g = ctx, lift = clamp(1 + P.dy / 90, .25, 1); g.save(); g.translate(home + P.dx, GROUND + 7); g.scale(1, .085);
  glowDot(g, 0, 0, 150 * lift, [0, 0, 0], .8 * lift); g.globalCompositeOperation = 'lighter'; glowDot(g, 0, 0, 170, col, .2 * lift * (.7 + .5 * P.glow)); g.restore();
}
/* effects ------------------------------------------------------------------ */
const SLASH = (() => { const A = [676, 232], B = [404, 500], dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  return [-46, 0, 46].map((o, i) => { const sh = i === 1 ? 0 : .07; return { a: [A[0] + nx * o + dx * sh, A[1] + ny * o + dy * sh], b: [B[0] + nx * o - dx * sh, B[1] + ny * o - dy * sh], c: [(A[0] + B[0]) / 2 + nx * (o + 30), (A[1] + B[1]) / 2 + ny * (o + 30)], t0: tC - .05 + i * .032 }; }); })();
const qp = (s, u) => [(1 - u) * (1 - u) * s.a[0] + 2 * u * (1 - u) * s.c[0] + u * u * s.b[0], (1 - u) * (1 - u) * s.a[1] + 2 * u * (1 - u) * s.c[1] + u * u * s.b[1]];
function slashPath(g, s, p, W) {
  const N = 26, L = [], R = [];
  for (let i = 0; i <= N; i++) { const u = p * i / N, a = qp(s, u), b = qp(s, u + .01), tx = b[0] - a[0], ty = b[1] - a[1], m = Math.hypot(tx, ty) || 1;
    const w = W * Math.pow(Math.sin(Math.PI * clamp(u * .92 + .04)), .7) * clamp((p - u) / .1 + .05); L.push([a[0] - ty / m * w, a[1] + tx / m * w]); R.push([a[0] + ty / m * w, a[1] - tx / m * w]); }
  g.beginPath(); L.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); R.reverse().forEach(q => g.lineTo(q[0], q[1])); g.closePath();
}
function drawSlashes(t) {
  const g = ctx;
  for (const s of SLASH) {
    const tau = t - s.t0; if (tau <= 0 || tau > 1.7) continue;
    const p = E.outCubic(clamp(tau / .12)), heat = Math.exp(-tau * 2.6), fade = 1 - E.inOutCubic(clamp((tau - .75) / .85));
    g.save(); g.globalAlpha = fade * .75; g.fillStyle = '#12000a'; slashPath(g, s, p, 15); g.fill();                 // the gash itself
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = fade;
    g.shadowColor = `rgba(255,25,55,${.5 + .5 * heat})`; g.shadowBlur = (16 + 30 * heat) * K; g.fillStyle = rgb(mix([150, 8, 30], [255, 40, 62], clamp(heat * 1.6 + .25))); slashPath(g, s, p, 11); g.fill();
    g.shadowBlur = 0; g.fillStyle = rgb(mix([255, 60, 80], [255, 236, 226], heat), .35 + .65 * heat); slashPath(g, s, p, 4 + 2.5 * heat); g.fill();
    g.restore();
  }
}
function burst(seed, n, make) { const r = rng(seed), a = []; for (let i = 0; i < n; i++) a.push(make(r, i)); return a; }
const EMBERS = burst(301, 46, r => { const s = SLASH[Math.floor(r() * 3)], u = r(), p = qp(s, u), a = 2.3 + (r() - .5) * 1.5, v = 90 + r() * 420; return { t0: s.t0 + u * .12, x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .45 + r() * .8, r: 1.2 + r() * 2.4 }; });
const SPARKS = burst(302, 70, r => { const a = -Math.PI * .35 + (r() - .5) * 4.2, v = 180 + r() * 760; return { t0: tB + r() * .03, x: HIT[0], y: HIT[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: .4 + r() * .8, r: 1.2 + r() * 2.6 }; });
const GATHER = burst(303, 34, r => { const a = r() * TAU, d = 90 + r() * 150; return { t0: 3.55 + r() * .5, a, d, life: .32 + r() * .22, r: 1 + r() * 2 }; });
const STREAK = burst(304, 16, r => ({ oy: -150 + r() * 150, ox: -160 + r() * 120, len: 90 + r() * 220, w: 1 + r() * 2.6, d: r() * .12 }));
function drawParticles(t, list, hot, cool, grav, drag) {
  const g = ctx; g.save(); g.globalCompositeOperation = 'lighter';
  for (const p of list) { const tau = t - p.t0; if (tau <= 0 || tau >= p.life) continue; const u = tau / p.life, k = (1 - Math.exp(-drag * tau)) / drag;
    const x = p.x + p.vx * k, y = p.y + p.vy * k + .5 * grav * tau * tau, x2 = x - p.vx * Math.exp(-drag * tau) * .028, y2 = y - (p.vy * Math.exp(-drag * tau) + grav * tau) * .028;
    g.strokeStyle = rgb(mix(hot, cool, u), (1 - u) * (1 - u)); g.lineWidth = p.r * (1 - u * .6); g.lineCap = 'round'; g.beginPath(); g.moveTo(x2, y2); g.lineTo(x, y); g.stroke(); }
  g.restore();
}
function drawChargeFx(t, P) {
  const g = ctx; g.save(); g.globalCompositeOperation = 'lighter';
  const hx = BULL_X + P.dx + 140, hy = GROUND + P.dy - 130;                           // near the horns
  for (const p of GATHER) { const tau = t - p.t0; if (tau <= 0 || tau >= p.life) continue; const u = E.inCubic(tau / p.life), d = p.d * (1 - u);
    glowDot(g, hx + Math.cos(p.a) * d, hy + Math.sin(p.a) * d * .7, p.r * 3.5, [110, 255, 205], .85 * Math.sin(Math.PI * tau / p.life)); }
  const sp = env(t, 4.3, tB + .14, .1);                                               // speed streaks
  if (sp > 0) for (const s of STREAK) { const a = sp * clamp((t - 4.3 - s.d) / .08), x = BULL_X + P.dx + s.ox, y = GROUND + P.dy + s.oy, len = s.len * sp;
    const gr = g.createLinearGradient(x - len, y + len * .22, x, y); gr.addColorStop(0, 'rgba(60,255,190,0)'); gr.addColorStop(1, `rgba(150,255,220,${.55 * a})`); g.strokeStyle = gr; g.lineWidth = s.w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - len, y + len * .22); g.lineTo(x, y); g.stroke(); }
  const tau = t - tB;                                                                 // shockwave + flare
  if (tau > 0 && tau < .8) { const u = tau / .8, R = 8 + 330 * E.outExpo(u);
    g.strokeStyle = `rgba(130,255,215,${Math.pow(1 - u, 1.5) * .75})`; g.lineWidth = 9 * (1 - u) + 1; g.shadowColor = 'rgba(60,255,190,.9)'; g.shadowBlur = 24 * K; g.beginPath(); g.ellipse(HIT[0], HIT[1], R, R * .82, -.3, 0, TAU); g.stroke(); g.shadowBlur = 0;
    glowDot(g, HIT[0], HIT[1], 210 * (1 - u * .5), [170, 255, 225], Math.exp(-tau * 9)); }
  g.restore();
}
const CUBES_A = burst(305, 30, r => { const a = Math.PI + (r() - .5) * 1.6, v = 120 + r() * 420; return { t0: tC + .02 + r() * .05, x: 255 + r() * 60, y: 370 + r() * 60, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, life: .6 + r() * .7, r: 3 + r() * 6, sp: (r() - .5) * 14 }; });
const CUBES_B = burst(306, 44, r => { const a = -.5 + (r() - .5) * 1.9, v = 160 + r() * 560; return { t0: tB + r() * .05, x: HIT[0] + 20 + r() * 40, y: HIT[1] + (r() - .5) * 60, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, life: .6 + r() * .8, r: 3 + r() * 6.5, sp: (r() - .5) * 14 }; });
const CUBES_T = burst(307, 40, r => { const t0 = 4.3 + r() * .34, P = bullPose(t0); return { t0, x: BULL_X + P.dx - 60 - r() * 60, y: GROUND + P.dy - 30 - r() * 90, vx: -40 - r() * 120, vy: -30 + r() * 60, life: .45 + r() * .5, r: 2.5 + r() * 5, sp: (r() - .5) * 8 }; });
function drawCubes(t, list, c0, c1, grav, drag) {
  const g = ctx; for (const p of list) { const tau = t - p.t0; if (tau <= 0 || tau >= p.life) continue; const u = tau / p.life, k = (1 - Math.exp(-drag * tau)) / drag, sz = p.r * (1 - u * .7);
    g.save(); g.translate(p.x + p.vx * k, p.y + p.vy * k + .5 * grav * tau * tau); g.rotate(p.sp * tau); g.globalAlpha = Math.min(1, (1 - u) * 2.2);
    g.fillStyle = rgb(mix(c0, c1, (p.r * 7.3) % 1)); g.fillRect(-sz / 2, -sz / 2, sz, sz); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(-sz / 2, -sz / 2, sz, sz * .28); g.restore(); }
}
const DUST = [[tC + .02, 215, -1, 7], [4.27, 170, -1, 8], [5.02, 440, 1, 7], [5.01, 850, 1, 7]].map(([t0, x, dir, n], k) => burst(400 + k, n, r => ({ t0: t0 + r() * .06, x: x + (r() - .5) * 70, vx: dir * (30 + r() * 110), vy: -(15 + r() * 50), life: .5 + r() * .5, r: 8 + r() * 14 }))).flat();
function drawDust(t) { const g = ctx; g.save(); for (const p of DUST) { const tau = t - p.t0; if (tau <= 0 || tau >= p.life) continue; const u = tau / p.life, e = E.outCubic(u); glowDot(g, p.x + p.vx * e * p.life, GROUND - 4 + p.vy * e * p.life, p.r * (.6 + 1.6 * e), [150, 175, 205], .22 * (1 - u)); } g.restore(); }

/* ───────── frame ───────── */
function render(tau) {
  tau = ((tau % TT) + TT) % TT; NOW = tau; const t = storyTime(tau);
  const red = pulse(t, tC, 3.2), green = pulse(t, tB, 2.8);
  const sh = 15 * pulse(t, tC, 8) + 20 * pulse(t, tB, 7.5), zoom = 1 + .022 * pulse(t, tC, 7) + .03 * pulse(t, tB, 6) + .007 * Math.sin(TAU * tau / TT);
  const g = ctx; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.setTransform(K, 0, 0, K, 0, 0); g.translate(500, 500); g.scale(zoom, zoom); g.translate(-500 + sh * Math.sin(t * 91) + 2.5 * Math.sin(TAU * tau / TT), -500 + sh * Math.cos(t * 77) + 1.5 * Math.sin(TAU * 2 * tau / TT));
  drawBackdrop(tau, red, green);
  drawFrame(tau, red, green);
  drawMotes();
  drawScreen(t);
  drawGround(bullPose(t), BULL_X, [60, 255, 190]); drawGround(bearPose(t), BEAR_X, [150, 100, 255]);
  drawDust(t);
  const front = t > 4.0 && t < 6.35;                         // whoever is attacking draws on top
  let PB;
  if (front) { withGhosts(drawBear, bearPose, t); PB = withGhosts(drawBull, bullPose, t); }
  else { PB = withGhosts(drawBull, bullPose, t); withGhosts(drawBear, bearPose, t); }
  drawWordmark(t, red, green);
  drawTagline(tau);
  drawChargeFx(t, PB);
  drawCubes(t, CUBES_T, [18, 160, 124], [150, 255, 222], 260, 2.2);
  drawCubes(t, CUBES_A, [18, 160, 124], [150, 255, 222], 760, 2.6);
  drawCubes(t, CUBES_B, [86, 48, 190], [214, 186, 255], 760, 2.6);
  drawSlashes(t);
  drawParticles(t, EMBERS, [255, 220, 190], [255, 30, 50], 700, 3.2);
  drawParticles(t, SPARKS, [235, 255, 245], [40, 255, 170], 620, 3.4);
  if (red + green > .01) {                                    // light spill
    g.save(); g.globalCompositeOperation = 'lighter';
    const gr = g.createRadialGradient(540, 380, 40, 540, 380, 640), c = red > green ? [255, 30, 60] : [60, 255, 180], a = Math.max(red, green);
    gr.addColorStop(0, rgb(c, .2 * a)); gr.addColorStop(1, rgb(c, 0)); g.fillStyle = gr; g.fillRect(-100, -100, 1200, 1200); g.restore();
  }
}

/* ───────── run loop + controls ───────── */
let playing = true, speed = 1, clock = 0, last = 0, ready = false;
function resize() { const box = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3), px = Math.max(200, Math.round(box.width * dpr)); cv.width = px; cv.height = px; K = px / 1000; if (ready) render(clock); }
function tick(now) { const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; if (playing && ready) { clock = (clock + dt * speed) % TT; render(clock); } requestAnimationFrame(tick); }
const $ = id => document.getElementById(id);
$('btnPlay').addEventListener('click', () => { playing = !playing; $('btnPlay').textContent = playing ? 'Pause' : 'Play'; });
$('btnSlow').addEventListener('click', () => { speed = speed === 1 ? .25 : 1; $('btnSlow').setAttribute('aria-pressed', String(speed !== 1)); });
$('btnRestart').addEventListener('click', () => { clock = 0; if (!playing) render(0); });
window.addEventListener('resize', resize);document.addEventListener('visibilitychange',()=>{playing=!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches;last=0;});
window.__renderAt = t => { clock = t; render(t); };
function start() { buildWordmark(); ready = true; resize();
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { playing = false; $('btnPlay').textContent = 'Play'; clock = .7; render(clock); }
  requestAnimationFrame(tick); }
const fonts = document.fonts && document.fonts.load ? Promise.all([document.fonts.load(`800 100px "Montserrat"`), document.fonts.load(`600 19px "Montserrat"`)]) : Promise.resolve();
Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).catch(() => {}).then(loadSprites).then(start);
})();
