name: MARKET-DEX verified EOD refresh
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-refresh.yml'
      - 'scripts/update_market_data.py'
      - 'scripts/update_explore_data.py'
      - 'data/explore-config.json'
      - 'scripts/build_previews.py'
      - 'scripts/build_lab_data.py'
      - 'scripts/update_economy.py'
  schedule:
    - cron: '0 17 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: market-dex-daily-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install free data dependencies
        run: pip install -r requirements.txt
      - name: Fetch, validate, and publish source-dated snapshots
        run: python scripts/update_market_data.py
      - name: Fetch missing covered ticker histories
        run: python scripts/update_extra_tickers.py
      - name: Restore experimental history cache
        uses: actions/cache@v4
        with:
          path: data/lab-price-history.json
          key: lab-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lab-history-${{ runner.os }}-
      - name: Update index internals and global ETF observations
        run: python scripts/update_explore_data.py
      - name: Refresh official economic indicators
        run: python scripts/update_economy.py
      - name: Build lightweight published previews
        run: |
          python scripts/build_previews.py
          python scripts/build_lab_data.py
          python scripts/build_rulebook.py
      - name: Commit only when source observations changed
        shell: bash
        run: |
          git config user.name 'market-dex-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rulebook.json data/rules data/extra-tickers.json data/economy.json data/latest.json data/bootstrap.js data/treasury-history.json data/explore.json data/treasury-recent.json data/market-preview.json data/global-markets.json data/internals.json data/lab-sector.json data/lab-holdings.json data/lab-chips.json data/lab-manifest.json
          if git diff --cached --quiet; then
            echo 'No newer verified observation; leaving published snapshot unchanged.'
          else
            git commit -m 'data: update verified market and Treasury EOD observations'
            git push origin HEAD:main
          fi