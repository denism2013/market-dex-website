name: Reconcile post-close stock prices
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/close-refresh.yml'
      - 'scripts/refresh_market_close.py'
  schedule:
    - cron: '5 17,18 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: market-dex-daily-snapshot
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recheck daily OHLCV and rebuild dependent stock fields
        run: python scripts/refresh_market_close.py
      - name: Publish the verified stock snapshot
        run: |
          git config user.name 'market-dex-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/bootstrap.js data/market-preview.json data/extra-tickers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: reconcile source-dated post-close stock observations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
